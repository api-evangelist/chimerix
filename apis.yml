name: Chimerix
description: >-
  Chimerix, Inc. was a biopharmaceutical company headquartered in Durham, North
  Carolina, focused on developing medicines for serious and life-threatening
  diseases. It is best known for brincidofovir (TEMBEXA), an antiviral approved
  by the U.S. FDA in 2021 as a smallpox medical countermeasure, and for
  dordaviprone (ONC201), an investigational small-molecule therapy for
  H3 K27M-mutant diffuse glioma, a form of brain cancer. Chimerix was a publicly
  traded company (NASDAQ: CMRX) and was acquired by Jazz Pharmaceuticals in 2025,
  primarily for dordaviprone; the chimerix.com domain now redirects to
  jazzpharma.com. As a clinical-stage pharmaceutical company, Chimerix does not
  operate a public developer program or API surface — this profile tracks it as a
  company entity within the API Evangelist network.
